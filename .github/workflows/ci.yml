name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Geometry units
        run: npm test

      - name: Chrome for the browser checks
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser checks
        env:
          FP_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tools/serve.mjs 8099 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8099/demo/ >/dev/null; then break; fi
            sleep 0.25
          done
          node test/e2e.mjs

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/screenshots/
          if-no-files-found: ignore
